# 📊 Needs Assessment
## Diagnosing Learner Baselines

---

# 🎯 The Objective

Before delivering targeted training, we must establish the baseline proficiency, confidence, and professional awareness of the cohort. 

<div class="highlight-box" style="margin-top: 1rem;">
<strong>The Goal:</strong> Address the learners' <em>actual</em> gaps, rather than assumed deficits.
</div>

---

# ⏱️ The Assessment Method

**"The Speed Networking Diagnostic"**
* **Duration:** 10 Minutes
* **Format:** Low-stakes, highly interactive pairs.
* **The Task:** "Introduce yourself, state your degree, and share one professional skill you want to learn this year."
* **Rotation:** 60 seconds per partner, 3 rotations total.

---

# 📋 The Trainer's Rubric

During the 10-minute activity, the trainer actively monitors and evaluates three core pillars:

1. **Fluency & Vocabulary:** Are they searching for basic words, using informal language, or deploying precise vocabulary?
2. **Body Language:** Are they making eye contact? How is their posture and vocal projection?
3. **Active Listening:** Are they asking follow-up questions or just waiting for their turn to speak?

---

# 🔄 Adapting to CEFR Levels

Based on the diagnostic, the curriculum is immediately adapted:

* **A1 / A2 (Beginner):** High structure. Provide sentence starters and written frameworks. Maximize paired practice.
* **B1 / B2 (Intermediate):** Focus on functional language (e.g., transition phrases). Shift from "getting words out" to "sounding professional."
* **C1 / C2 (Advanced):** High autonomy. Remove basic scaffolding. Introduce unpredictable scenarios (conflict, pushback) and focus on nuance.
